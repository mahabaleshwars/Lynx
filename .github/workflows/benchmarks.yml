name: Benchmarks

on:
  workflow_dispatch:
    inputs:
      benchmark_name:
        description: 'Benchmark name'
        default: '*'
        required: false

jobs:

  benchmark:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
      fail-fast: false

    env:
      DOTNET_VERSION: 9.0.x
      DOTNET_CLI_TELEMETRY_OPTOUT: 1

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
    - name: Verify .NET version
      run: |
          sudo dotnet --version

          # Ensure dotnet uses the right version
    - name: Update dotnet symlink to use .NET 9.0
      run: |
          # Check if dotnet is pointing to the right location
          if [[ $(ls -l /usr/bin/dotnet) != *"/usr/share/dotnet/dotnet"* ]]; then
            echo "Updating dotnet symlink to use .NET 9.0"
            sudo ln -sf /usr/share/dotnet/dotnet /usr/bin/dotnet
          else
            echo "Symlink is already correct."
          fi

      # Verify the installed .NET version
    - name: Verify .NET version
      run: |
          sudo dotnet --version
    
    - name: Nuget cache
      uses: actions/cache@v4
      with:
        path:
          ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Build
      run: dotnet build -c Release
      working-directory: ./src/Lynx.Benchmark

    - name: Run ${{ github.event.inputs.benchmark_name }} benchmark
      if: matrix.os == 'windows-latest'
      run: dotnet run -c Release --no-build --filter '${{ github.event.inputs.benchmark_name }}'
      working-directory: ./src/Lynx.Benchmark

    - name: Run ${{ github.event.inputs.benchmark_name }} benchmark with sudo
      if: matrix.os != 'windows-latest'
      run: |
            sudo  dotnet run -c Release --no-build --filter '${{ github.event.inputs.benchmark_name }}'
      working-directory: ./src/Lynx.Benchmark

    - name: 'Upload ${{ matrix.os }} artifacts'
      continue-on-error: false
      uses: actions/upload-artifact@v4
      with:
        name: artifacts-${{ matrix.os }}-${{ github.run_number }}
        # Can't include 'github.event.inputs.benchmark_name' in the name, since * is an invalid character
        path: ./src/Lynx.Benchmark/BenchmarkDotNet.Artifacts/results/
        if-no-files-found: error
